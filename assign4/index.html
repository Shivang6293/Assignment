<!DOCTYPE html>
<html>
<head>
    <title>Console Calculator Challenge</title>
</head>
<body>

    <h1>Console Calculator Challenge</h1>
    <p>Open the browser console (F12) to view the results.</p>

    <script>
        let num1 = 20;
        let num2 = 10;

        // Addition
        console.log("Addition:", num1 + num2);

        // Subtraction
        console.log("Subtraction:", num1 - num2);

        // Multiplication
        console.log("Multiplication:", num1 * num2);

        // Division
        console.log("Division:", num1 / num2);

        // Modulus
        console.log("Modulus:", num1 % num2);

        // Exponentiation
        console.log("Power:", num1 ** 2);
    </script>

</body>
</html>
